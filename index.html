<title>Ciudadano Transformador</title>

<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
}

#panel{
position:fixed;
top:15px;
left:15px;
z-index:10;
background:rgba(0,0,0,.80);
color:white;
padding:18px;
border-radius:15px;
width:260px;
}

#titulo{
font-size:22px;
font-weight:bold;
color:#FFD700;
margin-bottom:8px;
}

#puntos{
font-size:18px;
margin-bottom:8px;
}

#progreso{
font-size:16px;
}

#mensaje{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
z-index:20;
background:#111;
color:white;
padding:15px 25px;
border-radius:15px;
display:none;
font-size:18px;
text-align:center;
}

</style>

</head>


<body>


<!-- PANEL DEL JUGADOR -->

<div id="panel">

<div id="titulo">
🌎 CIUDADANO TRANSFORMADOR
</div>

<div id="puntos">
⭐ Puntos: <span id="score">0</span>
</div>

<div id="progreso">
🏛 Espacios: <span id="spaces">0</span>/17
</div>

<div id="progreso">
🏅 Insignias: <span id="badges">0</span>/4
</div>

</div>


<div id="mensaje"></div>


<a-scene
background="color:#87CEEB"
renderer="colorManagement:true">

<!-- LUCES -->

<a-light
type="ambient"
color="#FFFFFF"

</a-light>

<a-light

<a-plane

<a-sky

<a-animation
attribute="rotation"
to="0 360 0"
dur="5000"
repeat="indefinite">
</a-animation>

</a-ring>

<a-text
value="PORTAL DEL CIUDADANO TRANSFORMADOR"
position="-9 10 -40"
scale="2 2 2"
color="#FFD700">
</a-text>


</a-scene>



<script>


/* =====================================
   SISTEMA DE PUNTOS
===================================== */

let puntos = 0;

let espacios = 0;

let insignias = 0;


function actualizar(){

document.getElementById("score").innerText = puntos;

document.getElementById("spaces").innerText = espacios;

document.getElementById("badges").innerText = insignias;

}


/* =====================================
   MENSAJES
===================================== */

function mensaje(texto){

let caja =
document.getElementById("mensaje");

caja.innerHTML = texto;

caja.style.display = "block";

setTimeout(function(){

caja.style.display = "none";

},4000);

}


/* =====================================
   ACTIVIDADES
===================================== */

function abrirActividad(nombre){

puntos += 100;

mensaje(
"🎮 RETO: " + nombre +
"<br><br>Has entrado al desafío.<br>" +
"+100 puntos"
);

actualizar();

}


/* =====================================
   TECLAS
===================================== */

document.addEventListener(
"keydown",

function(event){

let jugador =
document.getElementById("jugador");

let posicion =
jugador.getAttribute("position");


if(event.key === "ArrowUp"){

posicion.z -= 1;

}

if(event.key === "ArrowDown"){

posicion.z += 1;

}

if(event.key === "ArrowLeft"){

posicion.x -= 1;

}

if(event.key === "ArrowRight"){

posicion.x += 1;

}

jugador.setAttribute(
"position",
posicion
);

}

);


/* =====================================
   INICIO
===================================== */

mensaje(
"🌎 Bienvenido, Ciudadano Transformador<br><br>" +
"Explora los 17 espacios académicos.<br>" +
"Supera los retos y derrota a los enemigos."
);

actualizar();

</script>


</body>

</html>
