<!DOCTYPE html>
<html>
<head>
  <title>Ciudadano Transformador</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-plane color="#FF8C00" rotation="-90 0 0" width="20" height="20"></a-plane>
    <a-sky color="#FF8C00"></a-sky>
    <a-box position="-2 0.5 -5" color="green"></a-box>
    <a-box position="0 0.5 -5" color="green"></a-box>
    <a-box position="2 0.5 -5" color="green"></a-box>
    <a-camera position="0 1.6 0" wasd-controls></a-camera>
  </a-scene>
</body>
</html>
